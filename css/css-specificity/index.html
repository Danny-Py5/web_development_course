<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Specificity</title>

    <style>
      .paragraph1 {
        color: orange !important;
      }
    </style>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <p class="paragraph1" id="paragraph-id" style="color: red">
      CSS Specificity helps the browser decide which style to use when different
      CSS rules try to style the same element.
    </p>
  </body>
</html>
