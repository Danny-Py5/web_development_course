<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styling An HTML Page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <!-- Hero section -->
      <section class="hero">
        <h1>Welcome to My Website</h1>
        <p>A simple webpage built with HTML and styled using CSS.</p>

        <div class="hero-img-container">
          <img src="landscape.jpg" alt="a landscape image" width="200" />
        </div>
      </section>
      <!-- About us -->
      <section class="about">
        <h2>About Us</h2>
        <p>
          We are passionate about learning and building amazing thins with web
          technologies
        </p>
      </section>
      <!-- What we do  -->
      <section class="what-we-do">
        <h2>What we Do</h2>
        <p>
          We learn web development and explore how HTML and CSS work together
        </p>
      </section>

      <!-- Our Gallery -->
      <section class="gallery">
        <h2>Our Gallery</h2>

        <div class="gallery-img-container">
          <img
            src="https://images.unsplash.com/photo-1759434190960-87511b2a5e5c?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
            alt="A beautiful Landscape"
            width="200"
          />
        </div>
      </section>
    </main>
    <footer>
      <p class="footer-p">&copy; 2026 My Website</p>
    </footer>
  </body>
</html>
