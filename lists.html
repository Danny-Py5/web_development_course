<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Lists</title>
  </head>
  <body>
    <h1>Html LIsts</h1>
    <br />
    <br />
    <br />
    <br />
    <br />

    <!-- unordered list -->
    <h2>My favourite foods</h2>
    <ul>
      <li>Chicken</li>
      <li>Beans</li>
      <li>Rice</li>
    </ul>

    <!-- ordered list -->
    <h2>Steps to create a website</h2>
    <ol>
      <li>Plan your website</li>
      <li>Write you HTML</li>
      <li>Open it in the browser</li>
    </ol>
  </body>
</html>
