<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML lists</title>
  </head>
  <body>
    <!-- Unordered List -->
    <h2>My favourite foods</h2>
    <ul>
      <li>Rice</li>
      <li>Beans</li>
      <li>Chicken</li>
    </ul>

    <!-- ordered list -->
    <h2>Steps to create a website</h2>
    <ol>
      <li>Plan your website</li>
      <li>Write your HTML</li>
      <li>Open it in the Browser</li>
    </ol>
  </body>
</html>
