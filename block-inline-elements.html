<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block and Inline Elements</title>
  </head>
  <body>
    <!-- BLOCK ELEMENTS EXAMPLES -->
    <h1>My website</h1>
    <p>welcome to my website</p>
    <p>We are learning HTML</p>

    <!-- INLINE ELEMENTS EXAMPLES -->
    <p>Welcome to my <a href="#">website</a></p>

    <img src="images/cat.jpg" alt="a cat image" width="300" />
    <img src="images/cat.jpg" alt="a cat image" width="300" />
  </body>
</html>
